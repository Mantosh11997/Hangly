name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # to attach the zip to a GitHub release on v* tags
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build windows --release

      # The exe needs the DLLs and data folder next to it, so ship the whole
      # Release folder.
      - name: Zip build
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Hangly-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Hangly-windows-x64
          path: build/windows/x64/runner/Release/

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Hangly-windows-x64.zip
